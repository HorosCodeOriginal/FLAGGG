# Your patch layer for this dsh profile, applied after every bundle layer
# UMGEBEN AUF NUR OPUS: alle Inception-Modelle entfernt, einziges Modell:
# claude-opus-5.5 via lokaler fr-gateway (127.0.0.1:20152), Key aus ~/.dsh/.credentials.yaml (OPUS_API_KEY).
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: opus
        model: claude-opus-5.5
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opus
    model: claude-opus-5.5
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opus:
        displayName: Opus
        apiKeyEnv: OPUS_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:20152/v1
        models:
          - id: claude-opus-5.5
            name: Claude Opus 5.5
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
