worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65s;

    # Upstream-spezifische Keys. Bewusst KEIN map: nginx cached Variablenwerte
    # pro Request, dadurch wuerde nach dem internen Redirect (Failover) weiter
    # der Key des ersten Upstreams gesendet. Darum setzt jede Location ihren
    # Key selbst; die Platzhalter ersetzt der entrypoint.
    lua_shared_dict locks 10m;
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;;';

    # Failover-Kette: primary -> backup1 -> backup2.
    # Die Platzhalter werden vom entrypoint aus dem upstream-Pool ersetzt
    # (manager liest fr-gateway/upstreams.json und setzt die Env-Variablen).
    upstream fr_primary {
        server __UPSTREAM_PRIMARY__ max_fails=2 fail_timeout=10s;
    }

    upstream fr_backup1 {
        server __UPSTREAM_BACKUP1__ max_fails=2 fail_timeout=10s;
    }

    upstream fr_backup2 {
        server __UPSTREAM_BACKUP2__ max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 64m;
        # erlaubt die kette primary -> backup1 -> backup2 -> json-fallback
        recursive_error_pages on;

        access_by_lua_block {
            require("fr_limiter").access()
        }

        location /v1/chat/completions {
            set $fr_upstream_key "__UPSTREAM_KEY_PRIMARY__";
            proxy_pass http://fr_primary/v1/chat/completions;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization "Bearer $fr_upstream_key";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 45s;
            proxy_connect_timeout 3s;
            # Failover: bei 429/5xx auf den naechsten Upstream umschalten
            proxy_intercept_errors on;
            error_page 401 402 403 429 500 502 503 504 = @fb1_chat;
        }

        location @fb1_chat {
            internal;
            set $fr_upstream_key "__UPSTREAM_KEY_BACKUP1__";
            proxy_pass http://fr_backup1;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization "Bearer $fr_upstream_key";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 45s;
            proxy_connect_timeout 3s;
            proxy_intercept_errors on;
            error_page 401 402 403 429 500 502 503 504 = @fb2_chat;
        }

        location @fb2_chat {
            internal;
            set $fr_upstream_key "__UPSTREAM_KEY_BACKUP2__";
            proxy_pass http://fr_backup2;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization "Bearer $fr_upstream_key";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 45s;
            proxy_connect_timeout 3s;
            # letzter Upstream: kein nginx-HTML an den Client, sondern JSON
            proxy_intercept_errors on;
            error_page 401 402 403 429 500 502 503 504 = @upstream_failed;
        }

        location @upstream_failed {
            internal;
            default_type application/json;
            return 429 '{"error":{"type":"upstream_unavailable","message":"alle upstreams im pool antworten mit 429/5xx"}}';
        }

        location /v1/models {
            set $fr_upstream_key "__UPSTREAM_KEY_PRIMARY__";
            proxy_pass http://fr_primary/v1/models;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "Bearer $fr_upstream_key";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 15s;
            proxy_intercept_errors on;
            error_page 401 402 403 429 500 502 503 504 = @fb1_models;
        }

        location @fb1_models {
            internal;
            set $fr_upstream_key "__UPSTREAM_KEY_BACKUP1__";
            proxy_pass http://fr_backup1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "Bearer $fr_upstream_key";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 15s;
            proxy_intercept_errors on;
            error_page 401 402 403 429 500 502 503 504 = @fb2_models;
        }

        location @fb2_models {
            internal;
            set $fr_upstream_key "__UPSTREAM_KEY_BACKUP2__";
            proxy_pass http://fr_backup2;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "Bearer $fr_upstream_key";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 15s;
            # letzter Upstream: kein nginx-HTML an den Client, sondern JSON
            proxy_intercept_errors on;
            error_page 401 402 403 429 500 502 503 504 = @upstream_failed;
        }

        location = /v1 {
            return 308 /v1/models;
        }

        location / {
            return 404;
        }

        body_filter_by_lua_block {
            require("fr_limiter").post_body()
        }
    }
}
