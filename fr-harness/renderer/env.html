<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fr-harness — Umgebung</title>
<link rel="stylesheet" href="env.css">
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
</head>
<body>

<div class="topbar">
  <span class="env-title" id="title">Umgebung —</span>
  <select id="modelSel" title="Modell"></select>
  <span class="params">
    <label>T <input type="number" id="pTemp" step="0.1" min="0" max="2" title="Temperatur"></label>
    <label>top_p <input type="number" id="pTop" step="0.05" min="0" max="1" title="top_p"></label>
    <label>max_tokens <input type="number" id="pMax" step="1" min="1" max="131072" title="max_tokens"></label>
  </span>
  <button id="btnExec" title="Chat senden">AUSFÜHREN</button>
  <button id="btnClear" title="Chat leeren">LEEREN</button>
  <button id="btnFiles" class="tabbtn on" title="Datei-Panel">DATEIEN</button>
  <button id="btnTerm" class="tabbtn" title="Terminal">TERMINAL</button>
  <button id="btnClose" title="Umgebung schließen">✕</button>
</div>

<div class="workspace">
  <div class="pane files" id="paneFiles">
    <div class="pane-head">
      <span>Dateien</span>
      <span class="fileops">
        <button id="btnNewFile" title="Neue Datei">+F</button>
        <button id="btnNewDir" title="Neues Verzeichnis">+D</button>
        <button id="btnDelete" title="Löschen">LÖSCHEN</button>
      </span>
    </div>
    <div class="tree" id="tree"></div>
  </div>
  <div class="drag" id="dragV"></div>

  <div class="pane chat" id="paneChat">
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <textarea id="composer" placeholder="Nachricht… (Umschalt+Enter = Senden)" rows="2"></textarea>
      <div class="composer-btns">
        <button id="btnSend">SENDEN</button>
        <button id="btnStop" disabled>STOPP</button>
      </div>
    </div>
  </div>
  <div class="drag" id="dragH"></div>

  <div class="pane side" id="paneSide">
    <div class="side-tabs">
      <button class="side-tab on" data-tab="term">TERMINAL</button>
      <button class="side-tab" data-tab="run">AUSFÜHRER</button>
      <button class="side-tab" data-tab="sys">SYSTEM</button>
    </div>
    <div class="side-body" id="sideTerm">
      <div id="terminal"></div>
    </div>
    <div class="side-body hidden" id="sideRun">
      <div class="run-head">
        <select id="runRuntime"><option value="node">node</option><option value="python">python</option><option value="shell">shell</option></select>
        <button id="btnRun">START</button>
      </div>
      <textarea id="runCode" placeholder="Code…" spellcheck="false"></textarea>
      <div class="run-out">
        <pre id="runStdout"></pre>
        <pre id="runStderr"></pre>
      </div>
    </div>
    <div class="side-body hidden" id="sideSys">
      <label>System-Prompt</label>
      <textarea id="sysPrompt" spellcheck="false"></textarea>
      <button id="btnSaveCfg">KONFIGURATION SPEICHERN</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">—</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalOk">OK</button>
      <button id="modalCancel">ABBRECHEN</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/monaco-editor/min/vs/loader.js"></script>
<script>
  require.config({ paths: { vs: '/vendor/monaco-editor/min/vs' } });
</script>
<script src="env.js"></script>
</body>
</html>
